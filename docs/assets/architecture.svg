<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
  <title id="title">snap-pair architecture</title>
  <desc id="desc">Your app sits on top of presets and components (useSnapPair, HostHUD, ControllerWrapper), which use three layers: Pairing (QR, PIN, broadcast), Transport (Firebase RTDB, PartyKit, WebRTC DataChannel, BroadcastChannel) and Client utilities (wake lock, orientation and motion).</desc>
  <style>
    .bg{fill:#f8fafc}.card{fill:#ffffff}.edge{stroke:#cbd5e1}
    .ink{fill:#0f172a}.muted{fill:#475569}
    .app{fill:#4f46e5}.app-t{fill:#ffffff}
    .kit{fill:#eef2ff}.kit-e{stroke:#c7d2fe}.kit-t{fill:#3730a3}
    .pair{fill:#fff7ed}.pair-e{stroke:#fdba74}.pair-t{fill:#9a3412}
    .tr{fill:#f0fdfa}.tr-e{stroke:#5eead4}.tr-t{fill:#115e59}
    .cl{fill:#fdf2f8}.cl-e{stroke:#f9a8d4}.cl-t{fill:#9d174d}
    .pill{fill:#ffffff}
    .arrow{stroke:#94a3b8}.arrow-f{fill:#94a3b8}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0b1020}.card{fill:#131a2e}.edge{stroke:#2c3757}
      .ink{fill:#e2e8f0}.muted{fill:#94a3b8}
      .app{fill:#6366f1}
      .kit{fill:#1a2042}.kit-e{stroke:#3b4384}.kit-t{fill:#c7d2fe}
      .pair{fill:#2a1a10}.pair-e{stroke:#9a4a17}.pair-t{fill:#fdba74}
      .tr{fill:#0c2523}.tr-e{stroke:#13756b}.tr-t{fill:#5eead4}
      .cl{fill:#2a1022}.cl-e{stroke:#9d2b6a}.cl-t{fill:#f9a8d4}
      .pill{fill:#0b1020}
      .arrow{stroke:#475569}.arrow-f{fill:#475569}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-f" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="560" rx="20"/>

  <!-- App -->
  <rect class="app" x="40" y="32" width="920" height="72" rx="14"/>
  <text class="app-t" x="500" y="64" font-size="22" font-weight="700" text-anchor="middle">Your app</text>
  <text class="app-t" x="500" y="88" font-size="14" text-anchor="middle" opacity="0.85">quiz · drawing wall · game · light show · showroom · installation</text>

  <path class="arrow" d="M500 106 V 128" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Kit: presets + components -->
  <rect class="kit kit-e" x="40" y="134" width="920" height="110" rx="14" stroke-width="1.5"/>
  <text class="kit-t" x="64" y="164" font-size="13" font-weight="700" letter-spacing="1.5">PRESETS · REACT · CLI</text>
  <g font-size="14" font-weight="600">
    <rect class="pill kit-e" x="64" y="180" width="160" height="44" rx="10" stroke-width="1"/>
    <text class="ink mono" x="144" y="207" text-anchor="middle">useSnapPair()</text>
    <rect class="pill kit-e" x="238" y="180" width="130" height="44" rx="10" stroke-width="1"/>
    <text class="ink mono" x="303" y="207" text-anchor="middle">&lt;HostHUD&gt;</text>
    <rect class="pill kit-e" x="382" y="180" width="200" height="44" rx="10" stroke-width="1"/>
    <text class="ink mono" x="482" y="207" text-anchor="middle">&lt;ControllerWrapper&gt;</text>
    <rect class="pill kit-e" x="596" y="180" width="140" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="666" y="207" text-anchor="middle">7 UX presets</text>
    <rect class="pill kit-e" x="750" y="180" width="186" height="44" rx="10" stroke-width="1"/>
    <text class="ink mono" x="843" y="207" text-anchor="middle">npx snap-pair init</text>
  </g>

  <path class="arrow" d="M190 246 V 268" stroke-width="2" marker-end="url(#ah)"/>
  <path class="arrow" d="M500 246 V 268" stroke-width="2" marker-end="url(#ah)"/>
  <path class="arrow" d="M810 246 V 268" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Pairing -->
  <rect class="pair pair-e" x="40" y="274" width="290" height="246" rx="14" stroke-width="1.5"/>
  <text class="pair-t" x="64" y="306" font-size="13" font-weight="700" letter-spacing="1.5">PAIRING</text>
  <text class="muted" x="64" y="328" font-size="13">How a device finds the room</text>
  <g font-size="14">
    <rect class="pill pair-e" x="64" y="346" width="242" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="82" y="373" font-weight="600">QR code</text><text class="muted mono" x="290" y="373" text-anchor="end" font-size="12">?room= / ?pin=</text>
    <rect class="pill pair-e" x="64" y="400" width="242" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="82" y="427" font-weight="600">6-digit PIN</text><text class="muted mono" x="290" y="427" text-anchor="end" font-size="12">042 917</text>
    <rect class="pill pair-e" x="64" y="454" width="242" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="82" y="481" font-weight="600">Broadcast</text><text class="muted" x="290" y="481" text-anchor="end" font-size="12">same browser</text>
  </g>

  <!-- Transport -->
  <rect class="tr tr-e" x="355" y="274" width="290" height="246" rx="14" stroke-width="1.5"/>
  <text class="tr-t" x="379" y="306" font-size="13" font-weight="700" letter-spacing="1.5">TRANSPORT</text>
  <text class="muted" x="379" y="328" font-size="13">One API, four backends</text>
  <g font-size="14" font-weight="600">
    <rect class="pill tr-e" x="379" y="346" width="117" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="437" y="366" text-anchor="middle">Firebase</text><text class="muted" x="437" y="382" text-anchor="middle" font-size="11" font-weight="400">RTDB</text>
    <rect class="pill tr-e" x="504" y="346" width="117" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="562" y="366" text-anchor="middle">PartyKit</text><text class="muted" x="562" y="382" text-anchor="middle" font-size="11" font-weight="400">WebSocket relay</text>
    <rect class="pill tr-e" x="379" y="400" width="117" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="437" y="420" text-anchor="middle">WebRTC</text><text class="muted" x="437" y="436" text-anchor="middle" font-size="11" font-weight="400">DataChannel</text>
    <rect class="pill tr-e" x="504" y="400" width="117" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="562" y="420" text-anchor="middle">Broadcast</text><text class="muted" x="562" y="436" text-anchor="middle" font-size="11" font-weight="400">Channel</text>
  </g>
  <text class="muted mono" x="500" y="474" font-size="12" text-anchor="middle">connect · createRoom · joinRoom</text>
  <text class="muted mono" x="500" y="494" font-size="12" text-anchor="middle">setState · broadcast · onMessage</text>

  <!-- Client -->
  <rect class="cl cl-e" x="670" y="274" width="290" height="246" rx="14" stroke-width="1.5"/>
  <text class="cl-t" x="694" y="306" font-size="13" font-weight="700" letter-spacing="1.5">CLIENT UTILITIES</text>
  <text class="muted" x="694" y="328" font-size="13">Make phones good controllers</text>
  <g font-size="14">
    <rect class="pill cl-e" x="694" y="346" width="242" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="712" y="373" font-weight="600">Screen wake lock</text><text class="muted mono" x="920" y="373" text-anchor="end" font-size="12">useWakeLock</text>
    <rect class="pill cl-e" x="694" y="400" width="242" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="712" y="427" font-weight="600">Orientation</text><text class="muted" x="920" y="427" text-anchor="end" font-size="12">iOS permission</text>
    <rect class="pill cl-e" x="694" y="454" width="242" height="44" rx="10" stroke-width="1"/>
    <text class="ink" x="712" y="481" font-weight="600">Motion · lock</text><text class="muted mono" x="920" y="481" text-anchor="end" font-size="12">subscribeMotion</text>
  </g>

  <text class="muted" x="500" y="546" font-size="12" text-anchor="middle">Every module is SSR-safe to import. Swap the transport without touching your UI.</text>
</svg>
