<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Transport comparison</title>
  <desc id="desc">Firebase RTDB: works across devices and the internet, medium latency, managed backend, free Spark tier or Blaze for Cloud Functions, no offline. PartyKit: internet, low latency, small relay server, free to start, no offline. WebRTC: peer-to-peer lowest latency, needs signaling and STUN or TURN, free with STUN, LAN possible. BroadcastChannel: same browser only, instant, no server, free, works offline.</desc>
  <style>
    .bg{fill:#f5f5f5}.surface{fill:#ffffff}.acc-soft{fill:#e8f0fa}
    .hair{stroke:#e5e5e5}.strong{stroke:#cfcfcf}
    .ink{fill:#0a0a0a}.ink-s{stroke:#0a0a0a}.ink2{fill:#3d3d3d}.muted{fill:#666666}.faint{fill:#999999}.faint-s{stroke:#999999}
    .acc{fill:#0062cc}
    .bar0{fill:#e5e5e5}.bar1{fill:#3d3d3d}
    text{font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141414}.surface{fill:#111111}.acc-soft{fill:#0f1f33}
      .hair{stroke:#262626}.strong{stroke:#3a3a3a}
      .ink{fill:#f2f2f2}.ink-s{stroke:#f2f2f2}.ink2{fill:#d4d4d4}.muted{fill:#a3a3a3}.faint{fill:#6b6b6b}.faint-s{stroke:#6b6b6b}
      .acc{fill:#3b9cff}
      .bar0{fill:#262626}.bar1{fill:#d4d4d4}
    }
  </style>
  <defs>
    <!-- yes: filled ink dot · no: hollow ring · partial: half-filled ring -->
    <g id="yes"><circle class="ink" r="5.5"/></g>
    <g id="no"><circle class="faint-s" r="5" fill="none" stroke-width="1.25"/></g>
    <g id="part"><circle class="ink-s" r="5" fill="none" stroke-width="1.25"/><path class="ink" d="M0 -5 A5 5 0 0 1 0 5 z"/></g>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="440" rx="0"/>
  <rect class="surface hair" x="24.5" y="24.5" width="951" height="391" rx="8" stroke-width="1"/>

  <!-- header -->
  <g class="muted mono" font-size="10" letter-spacing="1.5" text-anchor="middle">
    <text x="56" y="55" text-anchor="start">TRANSPORT</text>
    <text x="352" y="55">SAME DEVICE</text>
    <text x="462" y="55">INTERNET</text>
    <text x="572" y="55">LATENCY</text>
    <text x="704" y="55">SERVER NEEDED</text>
    <text x="840" y="55">COST / FREE TIER</text>
    <text x="940" y="55">OFFLINE</text>
  </g>
  <g class="faint" font-size="11" text-anchor="middle">
    <text x="352" y="72">tabs / windows</text>
    <text x="462" y="72">phone ↔ screen</text>
    <text x="572" y="72">typical</text>
  </g>

  <!-- recommended / default row -->
  <rect class="acc-soft" x="25" y="84.5" width="950" height="79.5"/>
  <rect class="acc" x="25" y="84.5" width="2" height="79.5"/>

  <!-- rows: y centers 120, 200, 280, 360 -->
  <g class="hair" stroke-width="1">
    <path d="M24 84.5 H976 M24 164.5 H976 M24 244.5 H976 M24 324.5 H976"/>
  </g>

  <!-- Firebase -->
  <g transform="translate(0 124)">
    <text class="ink" x="56" y="-4" font-size="17" font-weight="600" letter-spacing="-0.2">Firebase RTDB</text>
    <text class="muted" x="56" y="16" font-size="12">default · secure rooms up to 300</text>
    <text class="acc mono" x="240" y="-8" font-size="9.5" letter-spacing="1.5">DEFAULT</text>
    <use href="#yes" x="352" y="0"/>
    <use href="#yes" x="462" y="0"/>
    <g transform="translate(540 -4)"><rect class="bar1" width="20" height="8" rx="1"/><rect class="bar1" x="22" width="20" height="8" rx="1"/><rect class="bar0" x="44" width="20" height="8" rx="1"/></g>
    <text class="muted mono" x="572" y="22" font-size="10.5" text-anchor="middle">~100–300 ms</text>
    <text class="ink" x="704" y="-2" font-size="13" text-anchor="middle">Managed (Google)</text>
    <text class="muted" x="704" y="16" font-size="11" text-anchor="middle">+ Cloud Functions</text>
    <text class="ink" x="840" y="-2" font-size="13" text-anchor="middle">Spark free</text>
    <text class="muted" x="840" y="16" font-size="11" text-anchor="middle">Blaze for Functions</text>
    <use href="#no" x="940" y="0"/>
  </g>

  <!-- PartyKit -->
  <g transform="translate(0 204)">
    <text class="ink" x="56" y="-4" font-size="17" font-weight="600" letter-spacing="-0.2">PartyKit</text>
    <text class="muted" x="56" y="16" font-size="12">WebSocket relay · Cloudflare</text>
    <use href="#yes" x="352" y="0"/>
    <use href="#yes" x="462" y="0"/>
    <g transform="translate(540 -4)"><rect class="bar1" width="20" height="8" rx="1"/><rect class="bar1" x="22" width="20" height="8" rx="1"/><rect class="bar1" x="44" width="20" height="8" rx="1"/></g>
    <text class="muted mono" x="572" y="22" font-size="10.5" text-anchor="middle">~30–120 ms</text>
    <text class="ink" x="704" y="-2" font-size="13" text-anchor="middle">Tiny relay</text>
    <text class="muted" x="704" y="16" font-size="11" text-anchor="middle">examples/partykit</text>
    <text class="ink" x="840" y="-2" font-size="13" text-anchor="middle">Free to start</text>
    <text class="muted" x="840" y="16" font-size="11" text-anchor="middle">usage-based</text>
    <use href="#no" x="940" y="0"/>
  </g>

  <!-- WebRTC -->
  <g transform="translate(0 284)">
    <text class="ink" x="56" y="-4" font-size="17" font-weight="600" letter-spacing="-0.2">WebRTC</text>
    <text class="muted" x="56" y="16" font-size="12">DataChannel star · P2P</text>
    <use href="#yes" x="352" y="0"/>
    <use href="#yes" x="462" y="0"/>
    <g transform="translate(529 -4)"><rect class="bar1" width="20" height="8" rx="1"/><rect class="bar1" x="22" width="20" height="8" rx="1"/><rect class="bar1" x="44" width="20" height="8" rx="1"/><rect class="bar1" x="66" width="20" height="8" rx="1"/></g>
    <text class="muted mono" x="572" y="22" font-size="10.5" text-anchor="middle">lowest · direct</text>
    <text class="ink" x="704" y="-2" font-size="13" text-anchor="middle">Signaling only</text>
    <text class="muted" x="704" y="16" font-size="11" text-anchor="middle">+ STUN / TURN</text>
    <text class="ink" x="840" y="-2" font-size="13" text-anchor="middle">Free (STUN)</text>
    <text class="muted" x="840" y="16" font-size="11" text-anchor="middle">TURN may cost</text>
    <use href="#part" x="940" y="0"/>
    <text class="muted mono" x="940" y="24" font-size="10" letter-spacing="1" text-anchor="middle">LAN</text>
  </g>

  <!-- BroadcastChannel -->
  <g transform="translate(0 364)">
    <text class="ink" x="56" y="-4" font-size="17" font-weight="600" letter-spacing="-0.2">BroadcastChannel</text>
    <text class="muted" x="56" y="16" font-size="12">same browser · multi-display</text>
    <use href="#yes" x="352" y="0"/>
    <use href="#no" x="462" y="0"/>
    <g transform="translate(529 -4)"><rect class="bar1" width="20" height="8" rx="1"/><rect class="bar1" x="22" width="20" height="8" rx="1"/><rect class="bar1" x="44" width="20" height="8" rx="1"/><rect class="bar1" x="66" width="20" height="8" rx="1"/></g>
    <text class="muted mono" x="572" y="22" font-size="10.5" text-anchor="middle">&lt; 1 ms</text>
    <text class="ink" x="704" y="-2" font-size="13" text-anchor="middle">None</text>
    <text class="muted" x="704" y="16" font-size="11" text-anchor="middle">same origin</text>
    <text class="ink" x="840" y="-2" font-size="13" text-anchor="middle">Free</text>
    <text class="muted" x="840" y="16" font-size="11" text-anchor="middle">no account</text>
    <use href="#yes" x="940" y="0"/>
  </g>

  <!-- legend -->
  <g class="faint mono" font-size="9.5" letter-spacing="1.5">
    <use href="#yes" x="694" y="428"/><text x="704" y="431.5">YES</text>
    <use href="#no" x="752" y="428"/><text x="762" y="431.5">NO</text>
    <use href="#part" x="802" y="428"/><text x="812" y="431.5">PARTIAL</text>
    <rect class="bar1" x="892" y="424" width="8" height="8" rx="1"/><text x="906" y="431.5">SPEED</text>
  </g>
</svg>
