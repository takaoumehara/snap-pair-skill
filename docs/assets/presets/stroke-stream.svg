<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Stroke Stream</title>
  <desc id="desc">Stroke Stream preset (stroke-stream): Draw on your phone; strokes stream live onto the big screen. Recommended transport: PartyKit · WebRTC.</desc>
  <style>
    .bg{fill:#ffffff}.edge{stroke:#e2e8f0}.ink{fill:#0f172a}.muted{fill:#475569}.faint{fill:#94a3b8}
    .tint{fill:#eef2ff}.acc{fill:#4f46e5}.acc-s{stroke:#4f46e5}.chip{fill:#eef2ff}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#131a2e}.edge{stroke:#26304a}.ink{fill:#e2e8f0}.muted{fill:#a3b0c5}.faint{fill:#64748b}
      .tint{fill:#1a2042}.acc{fill:#818cf8}.acc-s{stroke:#818cf8}.chip{fill:#1a2042}
    }
  </style>
  <rect class="bg edge" x="1" y="1" width="358" height="218" rx="16" stroke-width="1.5"/>
  <rect class="tint" x="20" y="20" width="68" height="64" rx="14"/>
  <g transform="translate(20 20)"><path d="M14 44 C 22 20, 34 20, 38 34 S 50 46, 54 20" fill="none" class="acc-s" stroke-width="6" stroke-linecap="round"/><circle cx="54" cy="20" r="5" class="acc"/></g>
  <text class="faint mono" x="340" y="38" font-size="11" text-anchor="end">stroke-stream</text>
  <text class="ink" x="20" y="116" font-size="21" font-weight="700">Stroke Stream</text>
  <text class="muted" x="20" y="142" font-size="13.5">Draw on your phone; strokes stream</text>
  <text class="muted" x="20" y="161" font-size="13.5">live onto the big screen.</text>
  <rect class="chip" x="20" y="178" width="151" height="24" rx="12"/>
  <circle class="acc" cx="33" cy="190" r="4"/>
  <text class="ink" x="43" y="194.5" font-size="12" font-weight="600">PartyKit · WebRTC</text>
</svg>
