<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Controller</title>
  <desc id="desc">Virtual Controller preset (virtual-controller): D-pad and buttons turn every phone into a gamepad. Recommended transport: WebRTC · PartyKit.</desc>
  <style>
    .bg{fill:#f5f5f5}.surface{fill:#ffffff}.hair{stroke:#e5e5e5}.strong{stroke:#cfcfcf}
    .ink{fill:#0a0a0a}.ink-s{stroke:#0a0a0a}.ink2{fill:#3d3d3d}.muted{fill:#666666}.faint{fill:#999999}
    .acc{fill:#0062cc}.acc-s{stroke:#0062cc}
    text{font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141414}.surface{fill:#111111}.hair{stroke:#262626}.strong{stroke:#3a3a3a}
      .ink{fill:#f2f2f2}.ink-s{stroke:#f2f2f2}.ink2{fill:#d4d4d4}.muted{fill:#a3a3a3}.faint{fill:#6b6b6b}
      .acc{fill:#3b9cff}.acc-s{stroke:#3b9cff}
    }
  </style>
  <rect class="bg" x="0" y="0" width="360" height="220" rx="0"/>
  <rect class="surface hair" x="20.5" y="20.5" width="55" height="55" rx="6" stroke-width="1"/>
  <g transform="translate(20 20)"><rect class="ink-s" x="8" y="17" width="40" height="22" rx="8" fill="none" stroke-width="1.5"/><path class="ink-s" d="M15 28 H23 M19 24 V32" stroke-width="1.5" stroke-linecap="round"/><circle class="ink-s" cx="36" cy="25" r="2" fill="none" stroke-width="1.5"/><circle class="acc" cx="41" cy="31" r="2.5"/></g>
  <text class="faint mono" x="340" y="34" font-size="10" letter-spacing="1" text-anchor="end">virtual-controller</text>
  <text class="ink" x="20" y="114" font-size="20" font-weight="600" letter-spacing="-0.4">Virtual Controller</text>
  <text class="muted" x="20" y="140" font-size="13.5">D-pad and buttons turn every phone</text>
  <text class="muted" x="20" y="159" font-size="13.5">into a gamepad.</text>
  <path class="hair" d="M20 178.5 H340" stroke-width="1"/>
  <text class="faint mono" x="20" y="201" font-size="10" letter-spacing="1.5">RECOMMENDED</text>
  <text class="ink2" x="340" y="201" font-size="12.5" font-weight="500" text-anchor="end">WebRTC · PartyKit</text>
</svg>
