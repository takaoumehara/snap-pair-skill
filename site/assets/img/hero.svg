<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">snap-pair: multi-screen interactive web experiences</title>
  <desc id="desc">A phone acting as a controller draws a stroke that appears live on a big host screen showing a QR code and a six-digit PIN.</desc>
  <style>
    .bg{fill:#f5f5f5}.surface{fill:#ffffff}.canvas{fill:#ffffff}
    .hair{stroke:#e5e5e5}.strong{stroke:#cfcfcf}.strong-f{fill:#cfcfcf}
    .ink{fill:#0a0a0a}.ink2{fill:#3d3d3d}.muted{fill:#666666}.faint{fill:#999999}
    .acc{fill:#0062cc}.acc-s{stroke:#0062cc}
    .qr{fill:#0a0a0a}.qrbg{fill:#ffffff}
    text{font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141414}.surface{fill:#111111}.canvas{fill:#0a0a0a}
      .hair{stroke:#262626}.strong{stroke:#3a3a3a}.strong-f{fill:#3a3a3a}
      .ink{fill:#f2f2f2}.ink2{fill:#d4d4d4}.muted{fill:#a3a3a3}.faint{fill:#6b6b6b}
      .acc{fill:#3b9cff}.acc-s{stroke:#3b9cff}
      .qr{fill:#0a0a0a}.qrbg{fill:#f2f2f2}
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="420" rx="0"/>

  <!-- Phone (controller) -->
  <g transform="translate(180 96) rotate(-6)">
    <rect class="surface strong" x="0" y="0" width="128" height="232" rx="16" stroke-width="1.5"/>
    <rect class="canvas hair" x="8" y="24" width="112" height="184" rx="6" stroke-width="1"/>
    <rect class="strong-f" x="50" y="11" width="28" height="4" rx="2"/>
    <text class="faint mono" x="20" y="44" font-size="9" letter-spacing="1.5">DRAW</text>
    <path class="acc-s" d="M26 160 C 42 100, 72 100, 82 130 S 100 140, 102 88" fill="none" stroke-width="3.5" stroke-linecap="round"/>
    <circle class="acc" cx="102" cy="88" r="4.5"/>
    <rect class="hair" x="50" y="196" width="28" height="3" rx="1.5" fill="none" stroke-width="1"/>
  </g>

  <!-- Live data path: phone to host -->
  <path class="acc-s" d="M332 204 C 384 170, 440 170, 494 196" fill="none" stroke-width="1.25" stroke-dasharray="3 5" stroke-linecap="round"/>
  <circle class="acc" cx="332" cy="204" r="2.5"/>
  <circle class="acc" cx="494" cy="196" r="2.5"/>
  <text class="faint mono" x="413" y="148" font-size="10" letter-spacing="1.5" text-anchor="middle">REALTIME</text>
  <text class="ink2 mono" x="413" y="164" font-size="11" text-anchor="middle">broadcast('stroke')</text>

  <!-- Big screen (host) -->
  <g transform="translate(500 30)">
    <rect class="surface strong" x="0" y="0" width="520" height="300" rx="8" stroke-width="1.5"/>
    <rect class="canvas hair" x="12" y="12" width="496" height="276" rx="4" stroke-width="1"/>
    <rect class="surface strong" x="240" y="300" width="40" height="20" stroke-width="1.5"/>
    <rect class="surface strong" x="190" y="320" width="140" height="8" rx="2" stroke-width="1.5"/>
    <text class="faint mono" x="32" y="40" font-size="10" letter-spacing="1.5">LIVE CANVAS</text>
    <!-- earlier stroke from another player (monochrome) -->
    <path class="strong" d="M76 240 C 136 214, 186 254, 246 230" fill="none" stroke-width="3" stroke-linecap="round"/>
    <!-- the stroke arriving from the phone -->
    <path class="acc-s" d="M56 206 C 106 118, 166 118, 196 178 S 286 248, 336 156" fill="none" stroke-width="4.5" stroke-linecap="round"/>
    <circle class="acc" cx="336" cy="156" r="6"/>
    <!-- HUD with QR + PIN -->
    <g transform="translate(384 28)">
      <rect class="surface hair" x="0" y="0" width="112" height="150" rx="6" stroke-width="1"/>
      <g transform="translate(6 0)">
        <rect class="qrbg" x="14" y="12" width="72" height="72"/>
        <g class="qr">
          <rect x="18" y="16" width="20" height="20"/><rect x="62" y="16" width="20" height="20"/><rect x="18" y="60" width="20" height="20"/>
          <rect x="42" y="18" width="6" height="6"/><rect x="50" y="26" width="6" height="6"/><rect x="42" y="34" width="6" height="6"/>
          <rect x="44" y="46" width="6" height="6"/><rect x="56" y="44" width="6" height="6"/><rect x="66" y="50" width="6" height="6"/>
          <rect x="74" y="42" width="6" height="6"/><rect x="48" y="58" width="6" height="6"/><rect x="60" y="62" width="6" height="6"/>
          <rect x="70" y="66" width="10" height="6"/><rect x="44" y="72" width="6" height="6"/><rect x="56" y="74" width="6" height="6"/>
          <rect x="24" y="46" width="12" height="6"/>
        </g>
        <rect class="qrbg" x="22" y="20" width="12" height="12"/><rect class="qr" x="25" y="23" width="6" height="6"/>
        <rect class="qrbg" x="66" y="20" width="12" height="12"/><rect class="qr" x="69" y="23" width="6" height="6"/>
        <rect class="qrbg" x="22" y="64" width="12" height="12"/><rect class="qr" x="25" y="67" width="6" height="6"/>
      </g>
      <path class="hair" d="M12 94 H100" stroke-width="1"/>
      <text class="faint mono" x="56" y="111" font-size="10" text-anchor="middle" letter-spacing="2">PIN</text>
      <text class="ink mono" x="56" y="134" font-size="17" text-anchor="middle" font-weight="600">042 917</text>
    </g>
  </g>

  <!-- Captions -->
  <g>
    <path class="strong" d="M180 362 H336" stroke-width="1"/>
    <text class="faint mono" x="180" y="384" font-size="10" letter-spacing="2">CONTROLLER</text>
    <text class="muted" x="180" y="402" font-size="12">Phone browser, no install</text>

    <path class="strong" d="M500 362 H1020" stroke-width="1"/>
    <text class="faint mono" x="500" y="384" font-size="10" letter-spacing="2">HOST</text>
    <text class="muted" x="500" y="402" font-size="12">Big screen · laptop · projector</text>
    <text class="faint mono" x="1020" y="384" font-size="10" letter-spacing="2" text-anchor="end">QR · PIN · BROADCAST</text>
    <text class="muted mono" x="1020" y="402" font-size="11" text-anchor="end">Firebase · PartyKit · WebRTC · BroadcastChannel</text>
  </g>
</svg>
