<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
  <title id="title">snap-pair architecture</title>
  <desc id="desc">Your app sits on top of presets and components (useSnapPair, HostHUD, ControllerWrapper), which use three layers: Pairing (QR, PIN, broadcast), Transport (Firebase RTDB, PartyKit, WebRTC DataChannel, BroadcastChannel) and Client utilities (wake lock, orientation and motion).</desc>
  <style>
    .bg{fill:#f5f5f5}.surface{fill:#ffffff}.canvas{fill:#ffffff}.soft{fill:#f5f5f5}.acc-soft{fill:#e8f0fa}
    .hair{stroke:#e5e5e5}.strong{stroke:#cfcfcf}
    .ink{fill:#0a0a0a}.ink2{fill:#3d3d3d}.muted{fill:#666666}.faint{fill:#999999}
    .acc{fill:#0062cc}.acc-s{stroke:#0062cc}
    .arrow{stroke:#999999}.arrow-f{fill:#999999}
    text{font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141414}.surface{fill:#111111}.canvas{fill:#0a0a0a}.soft{fill:#141414}.acc-soft{fill:#0f1f33}
      .hair{stroke:#262626}.strong{stroke:#3a3a3a}
      .ink{fill:#f2f2f2}.ink2{fill:#d4d4d4}.muted{fill:#a3a3a3}.faint{fill:#6b6b6b}
      .acc{fill:#3b9cff}.acc-s{stroke:#3b9cff}
      .arrow{stroke:#6b6b6b}.arrow-f{fill:#6b6b6b}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow-f" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="acc" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="560" rx="0"/>

  <!-- App -->
  <rect class="canvas strong" x="40.5" y="32.5" width="919" height="71" rx="8" stroke-width="1.5"/>
  <text class="faint mono" x="64" y="72" font-size="10" letter-spacing="2">01 · APP</text>
  <text class="ink" x="500" y="64" font-size="20" font-weight="600" letter-spacing="-0.3" text-anchor="middle">Your app</text>
  <text class="muted" x="500" y="87" font-size="13.5" text-anchor="middle">quiz · drawing wall · game · light show · showroom · installation</text>

  <path class="arrow" d="M500 106 V 126" stroke-width="1.25" marker-end="url(#ah)"/>

  <!-- Kit: presets + components -->
  <rect class="canvas hair" x="40.5" y="134.5" width="919" height="109" rx="8" stroke-width="1"/>
  <text class="faint mono" x="64" y="163" font-size="10" letter-spacing="2">02 · PRESETS · REACT · CLI</text>
  <g font-size="13.5" font-weight="500">
    <rect class="soft hair" x="64.5" y="180.5" width="159" height="43" rx="4" stroke-width="1"/>
    <text class="ink mono" x="144" y="206" text-anchor="middle">useSnapPair()</text>
    <rect class="soft hair" x="238.5" y="180.5" width="129" height="43" rx="4" stroke-width="1"/>
    <text class="ink mono" x="303" y="206" text-anchor="middle">&lt;HostHUD&gt;</text>
    <rect class="soft hair" x="382.5" y="180.5" width="199" height="43" rx="4" stroke-width="1"/>
    <text class="ink mono" x="482" y="206" text-anchor="middle">&lt;ControllerWrapper&gt;</text>
    <rect class="soft hair" x="596.5" y="180.5" width="139" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="666" y="206" text-anchor="middle" font-size="14">7 UX presets</text>
    <rect class="soft hair" x="750.5" y="180.5" width="185" height="43" rx="4" stroke-width="1"/>
    <text class="ink mono" x="843" y="206" text-anchor="middle">npx snap-pair init</text>
  </g>

  <path class="arrow" d="M185 246 V 266" stroke-width="1.25" marker-end="url(#ah)"/>
  <path class="acc-s" d="M500 246 V 266" stroke-width="1.5" marker-end="url(#aha)"/>
  <path class="arrow" d="M815 246 V 266" stroke-width="1.25" marker-end="url(#ah)"/>

  <!-- Pairing -->
  <rect class="canvas hair" x="40.5" y="274.5" width="289" height="245" rx="8" stroke-width="1"/>
  <text class="faint mono" x="64" y="304" font-size="10" letter-spacing="2">03 · PAIRING</text>
  <text class="ink2" x="64" y="326" font-size="13.5">How a device finds the room</text>
  <g font-size="14">
    <rect class="soft hair" x="64.5" y="346.5" width="241" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="80" y="373" font-weight="500">QR code</text><text class="muted mono" x="290" y="373" text-anchor="end" font-size="11.5">?room= / ?pin=</text>
    <rect class="soft hair" x="64.5" y="400.5" width="241" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="80" y="427" font-weight="500">6-digit PIN</text><text class="muted mono" x="290" y="427" text-anchor="end" font-size="11.5">042 917</text>
    <rect class="soft hair" x="64.5" y="454.5" width="241" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="80" y="481" font-weight="500">Broadcast</text><text class="muted" x="290" y="481" text-anchor="end" font-size="12">same browser</text>
  </g>

  <!-- Transport (live data path, accent) -->
  <rect class="acc-soft acc-s" x="355.5" y="274.5" width="289" height="245" rx="8" stroke-width="1.25"/>
  <text class="acc mono" x="379" y="304" font-size="10" letter-spacing="2">04 · TRANSPORT</text>
  <text class="ink2" x="379" y="326" font-size="13.5">One API, four backends</text>
  <g font-size="14" font-weight="500">
    <rect class="surface hair" x="379.5" y="346.5" width="116" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="437" y="365" text-anchor="middle">Firebase</text><text class="muted mono" x="437" y="381" text-anchor="middle" font-size="10" font-weight="400">RTDB</text>
    <rect class="surface hair" x="504.5" y="346.5" width="116" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="562" y="365" text-anchor="middle">PartyKit</text><text class="muted mono" x="562" y="381" text-anchor="middle" font-size="10" font-weight="400">WebSocket relay</text>
    <rect class="surface hair" x="379.5" y="400.5" width="116" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="437" y="419" text-anchor="middle">WebRTC</text><text class="muted mono" x="437" y="435" text-anchor="middle" font-size="10" font-weight="400">DataChannel</text>
    <rect class="surface hair" x="504.5" y="400.5" width="116" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="562" y="419" text-anchor="middle">Broadcast</text><text class="muted mono" x="562" y="435" text-anchor="middle" font-size="10" font-weight="400">Channel</text>
  </g>
  <text class="ink2 mono" x="500" y="476" font-size="11.5" text-anchor="middle">connect · createRoom · joinRoom</text>
  <text class="ink2 mono" x="500" y="496" font-size="11.5" text-anchor="middle">setState · broadcast · onMessage</text>

  <!-- Client -->
  <rect class="canvas hair" x="670.5" y="274.5" width="289" height="245" rx="8" stroke-width="1"/>
  <text class="faint mono" x="694" y="304" font-size="10" letter-spacing="2">05 · CLIENT UTILITIES</text>
  <text class="ink2" x="694" y="326" font-size="13.5">Make phones good controllers</text>
  <g font-size="14">
    <rect class="soft hair" x="694.5" y="346.5" width="241" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="710" y="373" font-weight="500">Screen wake lock</text><text class="muted mono" x="920" y="373" text-anchor="end" font-size="11.5">useWakeLock</text>
    <rect class="soft hair" x="694.5" y="400.5" width="241" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="710" y="427" font-weight="500">Orientation</text><text class="muted" x="920" y="427" text-anchor="end" font-size="12">iOS permission</text>
    <rect class="soft hair" x="694.5" y="454.5" width="241" height="43" rx="4" stroke-width="1"/>
    <text class="ink" x="710" y="481" font-weight="500">Motion · lock</text><text class="muted mono" x="920" y="481" text-anchor="end" font-size="11.5">subscribeMotion</text>
  </g>

  <text class="muted" x="500" y="545" font-size="12.5" text-anchor="middle">Every module is SSR-safe to import. Swap the transport without touching your UI.</text>
</svg>
