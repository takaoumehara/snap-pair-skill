<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Phone with kiosk or big screen</title>
  <desc id="desc">Phone as input for a kiosk, signage, or event display.</desc>
  <style>
    .bg{fill:#f5f5f5}.surface{fill:#ffffff}.hair{stroke:#e5e5e5}.strong{stroke:#cfcfcf}.strong-f{fill:#cfcfcf}
    .ink{fill:#0a0a0a}.muted{fill:#666666}.acc{fill:#0062cc}.acc-s{stroke:#0062cc}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141414}.surface{fill:#111111}.hair{stroke:#262626}.strong{stroke:#3a3a3a}.strong-f{fill:#3a3a3a}
      .ink{fill:#f2f2f2}.muted{fill:#a3a3a3}.acc{fill:#3b9cff}.acc-s{stroke:#3b9cff}
    }
  </style>
  <rect class="bg" width="400" height="220"/>
  <g transform="translate(32 56)">
    <rect class="surface strong" x="0" y="0" width="64" height="112" rx="9" stroke-width="1.5"/>
    <rect class="hair" x="5" y="14" width="54" height="78" rx="3" stroke-width="1" fill="none"/>
    <rect class="acc" x="14" y="68" width="36" height="10" rx="3" opacity=".35"/>
  </g>
  <path class="acc-s" d="M108 108 C 160 100, 220 96, 280 104" fill="none" stroke-width="1.25" stroke-dasharray="4 5"/>
  <g transform="translate(280 24)">
    <rect class="surface strong" x="0" y="0" width="88" height="148" rx="4" stroke-width="1.5"/>
    <rect class="hair" x="6" y="10" width="76" height="100" rx="2" stroke-width="1" fill="none"/>
    <rect class="strong-f" x="34" y="148" width="20" height="24" rx="1"/>
    <rect class="strong-f" x="20" y="172" width="48" height="6" rx="2"/>
  </g>
</svg>
