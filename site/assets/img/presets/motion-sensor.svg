<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Motion / Sensor</title>
  <desc id="desc">Motion / Sensor preset (motion-sensor): Tilt, shake and rotate with device orientation (iOS permission handled). Recommended transport: WebRTC · PartyKit.</desc>
  <style>
    .bg{fill:#ffffff}.edge{stroke:#e2e8f0}.ink{fill:#0f172a}.muted{fill:#475569}.faint{fill:#94a3b8}
    .tint{fill:#f0f9ff}.acc{fill:#0284c7}.acc-s{stroke:#0284c7}.chip{fill:#f0f9ff}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#131a2e}.edge{stroke:#26304a}.ink{fill:#e2e8f0}.muted{fill:#a3b0c5}.faint{fill:#64748b}
      .tint{fill:#0b2233}.acc{fill:#38bdf8}.acc-s{stroke:#38bdf8}.chip{fill:#0b2233}
    }
  </style>
  <rect class="bg edge" x="1" y="1" width="358" height="218" rx="16" stroke-width="1.5"/>
  <rect class="tint" x="20" y="20" width="68" height="64" rx="14"/>
  <g transform="translate(20 20)"><g transform="rotate(-18 34 32)"><rect x="24" y="12" width="20" height="40" rx="5" fill="none" class="acc-s" stroke-width="4"/><circle cx="34" cy="45" r="2.5" class="acc"/></g><g fill="none" class="acc-s" stroke-width="3" stroke-linecap="round"><path d="M10 22 Q 6 32 10 42"/><path d="M58 22 Q 62 32 58 42"/></g></g>
  <text class="faint mono" x="340" y="38" font-size="11" text-anchor="end">motion-sensor</text>
  <text class="ink" x="20" y="116" font-size="21" font-weight="700">Motion / Sensor</text>
  <text class="muted" x="20" y="142" font-size="13.5">Tilt, shake and rotate with device</text>
  <text class="muted" x="20" y="161" font-size="13.5">orientation (iOS permission handled).</text>
  <rect class="chip" x="20" y="178" width="151" height="24" rx="12"/>
  <circle class="acc" cx="33" cy="190" r="4"/>
  <text class="ink" x="43" y="194.5" font-size="12" font-weight="600">WebRTC · PartyKit</text>
</svg>
