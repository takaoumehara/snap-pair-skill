<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Controller</title>
  <desc id="desc">Virtual Controller preset (virtual-controller): D-pad and buttons turn every phone into a gamepad. Recommended transport: WebRTC · PartyKit.</desc>
  <style>
    .bg{fill:#ffffff}.edge{stroke:#e2e8f0}.ink{fill:#0f172a}.muted{fill:#475569}.faint{fill:#94a3b8}
    .tint{fill:#fdf2f8}.acc{fill:#db2777}.acc-s{stroke:#db2777}.chip{fill:#fdf2f8}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#131a2e}.edge{stroke:#26304a}.ink{fill:#e2e8f0}.muted{fill:#a3b0c5}.faint{fill:#64748b}
      .tint{fill:#2a1022}.acc{fill:#f472b6}.acc-s{stroke:#f472b6}.chip{fill:#2a1022}
    }
  </style>
  <rect class="bg edge" x="1" y="1" width="358" height="218" rx="16" stroke-width="1.5"/>
  <rect class="tint" x="20" y="20" width="68" height="64" rx="14"/>
  <g transform="translate(20 20)"><rect x="6" y="18" width="56" height="30" rx="15" fill="none" class="acc-s" stroke-width="4"/><g class="acc"><rect x="17" y="30" width="14" height="5" rx="1.5"/><rect x="21.5" y="25.5" width="5" height="14" rx="1.5"/><circle cx="44" cy="29" r="3.5"/><circle cx="51" cy="36" r="3.5"/></g></g>
  <text class="faint mono" x="340" y="38" font-size="11" text-anchor="end">virtual-controller</text>
  <text class="ink" x="20" y="116" font-size="21" font-weight="700">Virtual Controller</text>
  <text class="muted" x="20" y="142" font-size="13.5">D-pad and buttons turn every phone</text>
  <text class="muted" x="20" y="161" font-size="13.5">into a gamepad.</text>
  <rect class="chip" x="20" y="178" width="151" height="24" rx="12"/>
  <circle class="acc" cx="33" cy="190" r="4"/>
  <text class="ink" x="43" y="194.5" font-size="12" font-weight="600">WebRTC · PartyKit</text>
</svg>
