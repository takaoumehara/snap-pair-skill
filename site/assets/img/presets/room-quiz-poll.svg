<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Room Quiz / Poll</title>
  <desc id="desc">Room Quiz / Poll preset (room-quiz-poll): Everyone answers on their phone; results appear instantly. Recommended transport: PartyKit (PIN, up to 300).</desc>
  <style>
    .bg{fill:#ffffff}.edge{stroke:#e2e8f0}.ink{fill:#0f172a}.muted{fill:#475569}.faint{fill:#94a3b8}
    .tint{fill:#f5f3ff}.acc{fill:#7c3aed}.acc-s{stroke:#7c3aed}.chip{fill:#f5f3ff}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#131a2e}.edge{stroke:#26304a}.ink{fill:#e2e8f0}.muted{fill:#a3b0c5}.faint{fill:#64748b}
      .tint{fill:#221640}.acc{fill:#a78bfa}.acc-s{stroke:#a78bfa}.chip{fill:#221640}
    }
  </style>
  <rect class="bg edge" x="1" y="1" width="358" height="218" rx="16" stroke-width="1.5"/>
  <rect class="tint" x="20" y="20" width="68" height="64" rx="14"/>
  <g transform="translate(20 20)"><g class="acc"><rect x="12" y="34" width="10" height="18" rx="2"/><rect x="27" y="20" width="10" height="32" rx="2"/><rect x="42" y="28" width="10" height="24" rx="2"/></g><path d="M10 56 H56" class="acc-s" stroke-width="3" stroke-linecap="round"/></g>
  <text class="faint mono" x="340" y="38" font-size="11" text-anchor="end">room-quiz-poll</text>
  <text class="ink" x="20" y="116" font-size="21" font-weight="700">Room Quiz / Poll</text>
  <text class="muted" x="20" y="142" font-size="13.5">Everyone answers on their phone;</text>
  <text class="muted" x="20" y="161" font-size="13.5">results appear instantly.</text>
  <rect class="chip" x="20" y="178" width="205" height="24" rx="12"/>
  <circle class="acc" cx="33" cy="190" r="4"/>
  <text class="ink" x="43" y="194.5" font-size="12" font-weight="600">PartyKit (PIN, up to 300)</text>
</svg>
