<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Particle Blast</title>
  <desc id="desc">Particle Blast preset (particle-blast): Tap or swipe to fire particle bursts across the host canvas. Recommended transport: PartyKit · WebRTC.</desc>
  <style>
    .bg{fill:#ffffff}.edge{stroke:#e2e8f0}.ink{fill:#0f172a}.muted{fill:#475569}.faint{fill:#94a3b8}
    .tint{fill:#fff7ed}.acc{fill:#ea580c}.acc-s{stroke:#ea580c}.chip{fill:#fff7ed}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#131a2e}.edge{stroke:#26304a}.ink{fill:#e2e8f0}.muted{fill:#a3b0c5}.faint{fill:#64748b}
      .tint{fill:#2a1a10}.acc{fill:#fb923c}.acc-s{stroke:#fb923c}.chip{fill:#2a1a10}
    }
  </style>
  <rect class="bg edge" x="1" y="1" width="358" height="218" rx="16" stroke-width="1.5"/>
  <rect class="tint" x="20" y="20" width="68" height="64" rx="14"/>
  <g transform="translate(20 20)"><circle cx="34" cy="32" r="7" class="acc"/><g class="acc-s" stroke-width="4" stroke-linecap="round"><path d="M34 16 V8"/><path d="M34 48 V56"/><path d="M18 32 H10"/><path d="M50 32 H58"/><path d="M23 21 L17 15"/><path d="M45 43 L51 49"/><path d="M45 21 L51 15"/><path d="M23 43 L17 49"/></g></g>
  <text class="faint mono" x="340" y="38" font-size="11" text-anchor="end">particle-blast</text>
  <text class="ink" x="20" y="116" font-size="21" font-weight="700">Particle Blast</text>
  <text class="muted" x="20" y="142" font-size="13.5">Tap or swipe to fire particle bursts</text>
  <text class="muted" x="20" y="161" font-size="13.5">across the host canvas.</text>
  <rect class="chip" x="20" y="178" width="151" height="24" rx="12"/>
  <circle class="acc" cx="33" cy="190" r="4"/>
  <text class="ink" x="43" y="194.5" font-size="12" font-weight="600">PartyKit · WebRTC</text>
</svg>
