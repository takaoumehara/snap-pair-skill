<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Type Throw</title>
  <desc id="desc">Type Throw preset (type-throw): Type a word and flick it onto the shared wall. Recommended transport: Firebase · PartyKit.</desc>
  <style>
    .bg{fill:#ffffff}.edge{stroke:#e2e8f0}.ink{fill:#0f172a}.muted{fill:#475569}.faint{fill:#94a3b8}
    .tint{fill:#f0fdfa}.acc{fill:#0d9488}.acc-s{stroke:#0d9488}.chip{fill:#f0fdfa}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#131a2e}.edge{stroke:#26304a}.ink{fill:#e2e8f0}.muted{fill:#a3b0c5}.faint{fill:#64748b}
      .tint{fill:#0c2523}.acc{fill:#2dd4bf}.acc-s{stroke:#2dd4bf}.chip{fill:#0c2523}
    }
  </style>
  <rect class="bg edge" x="1" y="1" width="358" height="218" rx="16" stroke-width="1.5"/>
  <rect class="tint" x="20" y="20" width="68" height="64" rx="14"/>
  <g transform="translate(20 20)"><text x="10" y="44" font-size="26" font-weight="800" class="acc">Aa</text><path d="M44 40 L58 18" class="acc-s" stroke-width="4" stroke-linecap="round"/><path d="M48 17 L58 18 L57 28" fill="none" class="acc-s" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="faint mono" x="340" y="38" font-size="11" text-anchor="end">type-throw</text>
  <text class="ink" x="20" y="116" font-size="21" font-weight="700">Type Throw</text>
  <text class="muted" x="20" y="142" font-size="13.5">Type a word and flick it onto</text>
  <text class="muted" x="20" y="161" font-size="13.5">the shared wall.</text>
  <rect class="chip" x="20" y="178" width="165" height="24" rx="12"/>
  <circle class="acc" cx="33" cy="190" r="4"/>
  <text class="ink" x="43" y="194.5" font-size="12" font-weight="600">Firebase · PartyKit</text>
</svg>
