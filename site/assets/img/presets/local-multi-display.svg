<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Local Multi-Display</title>
  <desc id="desc">Local Multi-Display preset (local-multi-display): Sync windows and tabs on one machine, even offline. Recommended transport: BroadcastChannel.</desc>
  <style>
    .bg{fill:#ffffff}.edge{stroke:#e2e8f0}.ink{fill:#0f172a}.muted{fill:#475569}.faint{fill:#94a3b8}
    .tint{fill:#f0fdf4}.acc{fill:#16a34a}.acc-s{stroke:#16a34a}.chip{fill:#f0fdf4}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#131a2e}.edge{stroke:#26304a}.ink{fill:#e2e8f0}.muted{fill:#a3b0c5}.faint{fill:#64748b}
      .tint{fill:#0e2416}.acc{fill:#4ade80}.acc-s{stroke:#4ade80}.chip{fill:#0e2416}
    }
  </style>
  <rect class="bg edge" x="1" y="1" width="358" height="218" rx="16" stroke-width="1.5"/>
  <rect class="tint" x="20" y="20" width="68" height="64" rx="14"/>
  <g transform="translate(20 20)"><g fill="none" class="acc-s" stroke-width="4" stroke-linejoin="round"><rect x="6" y="14" width="30" height="22" rx="3"/><rect x="32" y="24" width="30" height="22" rx="3"/></g><path d="M14 44 H26 M40 54 H54" class="acc-s" stroke-width="4" stroke-linecap="round"/></g>
  <text class="faint mono" x="340" y="38" font-size="11" text-anchor="end">local-multi-display</text>
  <text class="ink" x="20" y="116" font-size="21" font-weight="700">Local Multi-Display</text>
  <text class="muted" x="20" y="142" font-size="13.5">Sync windows and tabs on one</text>
  <text class="muted" x="20" y="161" font-size="13.5">machine, even offline.</text>
  <rect class="chip" x="20" y="178" width="144" height="24" rx="12"/>
  <circle class="acc" cx="33" cy="190" r="4"/>
  <text class="ink" x="43" y="194.5" font-size="12" font-weight="600">BroadcastChannel</text>
</svg>
