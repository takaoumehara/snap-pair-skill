name: Gallery Intake

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    if: contains(github.event.issue.labels.*.name, 'gallery-submission')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium
          
      - name: Parse and validate submission
        id: validate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          node scripts/gallery/process-submission.mjs
          
      - name: Commit changes
        if: steps.validate.outputs.status == 'accepted'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/gallery/gallery.json site/gallery/thumbs/
          git commit -m "Gallery: Add submission from issue #${{ github.event.issue.number }}"
          git push
          
      - name: Comment on issue (accepted)
        if: steps.validate.outputs.status == 'accepted'
        uses: actions/github-script@v7
        with:
          script: |
            const galleryUrl = process.env.GALLERY_URL || 'https://snappair.creativityiseverywhere.com/gallery/';
            const evidence = process.env.EVIDENCE || 'Snap Pair detected';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Submission accepted!**\n\nYour site has been added to the gallery. Evidence found: ${evidence}\n\nView it here: ${galleryUrl}\n\nThank you for sharing your Snap Pair project with the community!`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['gallery-accepted']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
        env:
          GALLERY_URL: ${{ steps.validate.outputs.gallery_url }}
          EVIDENCE: ${{ steps.validate.outputs.evidence }}
          
      - name: Comment on issue (rejected)
        if: steps.validate.outputs.status == 'rejected'
        uses: actions/github-script@v7
        with:
          script: |
            const reason = process.env.REJECTION_REASON || 'Validation failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Submission could not be accepted**\n\n${reason}\n\n### How to fix:\n- Ensure your site is publicly accessible over HTTPS\n- Make sure you're using snap-pair-core in your project\n- Check that the URL loads successfully\n\nIf you believe this is an error, please reply to this issue and a maintainer can manually review it by adding the \`gallery-approve\` label.`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['gallery-rejected']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
        env:
          REJECTION_REASON: ${{ steps.validate.outputs.reason }}
